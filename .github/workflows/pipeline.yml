name: pipeline
on:
  schedule:
    - cron: '7,37 * * * *' # GitHub zamanlayıcıyı sık sık atlıyor; yarım saatte bir denenir, bülten aralığını kod belirler
  workflow_dispatch:
    inputs:
      approve:
        description: 'Onaylanacak taslak id listesi (boşlukla ayır) ya da "all"'
        required: false
      reject:
        description: 'Reddedilecek taslak id listesi ya da "all"'
        required: false
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
env:
  APPROVAL_MODE: ${{ vars.APPROVAL_MODE || 'manual' }}
  # Slaytlar ana dala değil, her bültende baştan yazılan `cards` dalına gider (depo geçmişi şişmesin).
  IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/cards
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_API_VERSION: ${{ vars.IG_API_VERSION }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
  THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
  # Gemini kotası dolarsa yedek: bu Mac'teki FreeLLMAPI'nin dışarı açılmış adresi (tanımlı değilse kullanılmaz).
  FREELLMAPI_URL: ${{ secrets.FREELLMAPI_URL }}
  FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
  APPROVE_IDS: ${{ inputs.approve }}
  REJECT_IDS: ${{ inputs.reject }}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Onay / ret
        run: |
          if [ -n "$REJECT_IDS" ]; then node src/run.js reject $REJECT_IDS; fi
          if [ -n "$APPROVE_IDS" ]; then node src/run.js approve $APPROVE_IDS; fi
      - name: Haber havuzu ve bülten
        run: node src/run.js prepare
      - name: Havuzu depoya yaz
        run: |
          git config user.name "news-cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts posts data
          git diff --cached --quiet || git commit -m "havuz güncellendi"
          git pull --rebase
          git push
      - name: Slaytları cards dalına yaz
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Bu çalıştırmada yeni slayt yoksa dal olduğu gibi kalır.
          ls public/cards/*.jpg >/dev/null 2>&1 || exit 0
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q -b cards
          # Dal tek commit olarak tutulur ama içeriği birikir: yarım kalan gönderi sonraki çalıştırmada aynı adresten denenir.
          # Dosya adı tarihle başlar; iki günden eskiler silinir.
          if git fetch -q --depth 1 "$remote" cards; then git checkout -q FETCH_HEAD -- . ; fi
          cutoff=$(date -u -d '2 days ago' +%F)
          for f in *.jpg; do [ -e "$f" ] && [[ "${f:0:10}" < "$cutoff" ]] && rm -f "$f"; done
          cp "$GITHUB_WORKSPACE"/public/cards/*.jpg .
          git add -A
          git -c user.name="news-cards-bot" -c user.email="actions@users.noreply.github.com" commit -qm "slaytlar"
          git push -qf "$remote" cards
          # raw.githubusercontent yeni dosyayı sunana kadar bekle
          f=$(ls -t "$GITHUB_WORKSPACE"/public/cards/*.jpg | head -1)
          for i in $(seq 1 12); do curl -sfI "$IMAGE_BASE_URL/$(basename "$f")" >/dev/null && break; sleep 5; done
      - name: Yayınla
        if: env.IG_ACCESS_TOKEN != '' || env.FB_PAGE_TOKEN != '' || env.THREADS_ACCESS_TOKEN != ''
        run: node src/run.js publish
      - name: Yayın durumunu kaydet
        if: always()
        run: |
          git add drafts posts data
          git diff --cached --quiet || git commit -m "yayın durumu"
          git pull --rebase
          git push
